<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>风格方案 C · 沉静暗色 — 局域网游戏厅</title>
<style>
:root{
  --bg:#0E1013; --bg-2:#131619; --surface:#171B21; --surface-2:#1D222A;
  --border:#252B35; --border-2:#333B48;
  --text:#E7EAEF; --text-2:#99A1AD; --text-3:#6B7280;
  --accent:#D9A441; --accent-hover:#E8B858; --accent-subtle:rgba(217,164,65,.12);
  --green:#4ADE80; --green-subtle:rgba(74,222,128,.12);
  --amber:#FBBF24; --amber-subtle:rgba(251,191,36,.12);
  --red:#F87171;

  --space-1:4px; --space-2:8px; --space-3:12px; --space-4:16px;
  --space-5:20px; --space-6:24px; --space-8:32px; --space-10:40px;
  --radius-sm:6px; --radius-md:10px; --radius-lg:14px; --radius-full:9999px;

  --font-body:"Inter",system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  --dur:160ms; --ease:cubic-bezier(.22,1,.36,1);
}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font-body);
  font-size:.9375rem;line-height:1.6;-webkit-font-smoothing:antialiased}
h1,h2,h3{margin:0;font-weight:600;letter-spacing:-.01em;line-height:1.3}
p{margin:0}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:var(--radius-sm)}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);border:0}

.app{display:grid;grid-template-columns:228px 1fr;min-height:100vh}
.side{background:var(--bg-2);border-right:1px solid var(--border);
  display:flex;flex-direction:column;gap:var(--space-8);padding:var(--space-6) var(--space-4)}
.brand{display:flex;align-items:center;gap:var(--space-3);font-weight:600;
  padding:0 var(--space-2);font-size:.9375rem}
.brand-mark{width:26px;height:26px;border-radius:var(--radius-sm);
  background:var(--accent-subtle);color:var(--accent);display:grid;place-items:center;
  font-size:.8125rem;font-weight:700;flex:none}
.nav{display:flex;flex-direction:column;gap:2px}
.nav-item{display:flex;align-items:center;justify-content:space-between;gap:var(--space-3);
  padding:var(--space-3) var(--space-3);border-radius:var(--radius-sm);background:none;border:0;
  text-align:left;color:var(--text-2);font-size:.875rem;cursor:pointer;width:100%;
  transition:background var(--dur) var(--ease),color var(--dur) var(--ease)}
.nav-item:hover{background:var(--surface);color:var(--text)}
.nav-item[aria-current="page"]{background:var(--surface);color:var(--text);font-weight:500}
.nav-item[aria-current="page"]::before{content:"";position:absolute}
.count{font-size:.75rem;color:var(--text-3);font-variant-numeric:tabular-nums}
.conn{margin-top:auto;border-top:1px solid var(--border);padding:var(--space-4) var(--space-2) 0;
  font-size:.75rem;color:var(--text-3);line-height:1.7}
.dot{width:6px;height:6px;border-radius:var(--radius-full);background:var(--green);
  display:inline-block;margin-right:6px;vertical-align:1px}
.tnum{font-variant-numeric:tabular-nums}

.main{padding:var(--space-8) var(--space-10) var(--space-10);max-width:1080px}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:var(--space-6);
  margin-bottom:var(--space-8)}
.page-head h1{font-size:1.75rem;margin-bottom:var(--space-2)}
.page-head p{color:var(--text-2);font-size:.875rem;max-width:52ch}
.bar{display:flex;align-items:center;gap:var(--space-3)}
.search{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);
  padding:var(--space-2) var(--space-4);font-size:.8125rem;width:200px}
.search::placeholder{color:var(--text-3)}

.block-title{display:flex;align-items:baseline;justify-content:space-between;
  margin:var(--space-8) 0 var(--space-4)}
.block-title h2{font-size:1rem}
.block-title span{font-size:.75rem;color:var(--text-3);letter-spacing:.06em}

.grid{display:grid;gap:var(--space-3);grid-template-columns:repeat(auto-fill,minmax(232px,1fr))}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);
  padding:var(--space-4);display:flex;flex-direction:column;gap:var(--space-3);
  text-align:left;cursor:pointer;width:100%;
  transition:border-color var(--dur) var(--ease),background var(--dur) var(--ease)}
.card:hover{border-color:var(--border-2);background:var(--surface-2)}
.card-top{display:flex;align-items:center;gap:var(--space-3)}
.tile{width:34px;height:34px;border-radius:var(--radius-sm);background:var(--surface-2);
  border:1px solid var(--border);color:var(--accent);display:grid;place-items:center;
  font-weight:600;font-size:.9375rem;flex:none}
.card-name{font-weight:500;font-size:.9375rem}
.card-desc{font-size:.75rem;color:var(--text-3)}
.card-meta{display:flex;gap:var(--space-2);flex-wrap:wrap;
  border-top:1px solid var(--border);padding-top:var(--space-3)}
.chip{font-size:.6875rem;color:var(--text-2);background:var(--surface-2);
  border-radius:var(--radius-full);padding:2px 8px}

.rows{border:1px solid var(--border);border-radius:var(--radius-md);overflow:hidden;background:var(--surface)}
.row{display:grid;grid-template-columns:84px 1fr 90px 92px auto;gap:var(--space-4);
  align-items:center;padding:var(--space-3) var(--space-4);border-bottom:1px solid var(--border);
  font-size:.875rem}
.row:last-child{border-bottom:0}
.row-head{background:var(--bg-2);color:var(--text-3);font-size:.6875rem;
  letter-spacing:.08em;padding-top:var(--space-2);padding-bottom:var(--space-2)}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:.6875rem;
  padding:2px 8px;border-radius:var(--radius-full)}
.tag-wait{background:var(--amber-subtle);color:var(--amber)}
.tag-live{background:var(--green-subtle);color:var(--green)}
.btn{border:1px solid var(--border-2);background:transparent;border-radius:var(--radius-sm);
  padding:6px 14px;font-size:.8125rem;font-weight:500;cursor:pointer;color:var(--text-2);
  transition:border-color var(--dur) var(--ease),background var(--dur) var(--ease),color var(--dur) var(--ease)}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn-solid{background:var(--accent);border-color:var(--accent);color:#1A1305}
.btn-solid:hover{background:var(--accent-hover);border-color:var(--accent-hover);color:#1A1305}
.btn-sm{padding:4px 10px;font-size:.75rem}

.room-bar{display:flex;align-items:center;gap:var(--space-4);
  margin:var(--space-8) 0 var(--space-5)}
.back{background:none;border:0;padding:0;color:var(--text-3);cursor:pointer;font-size:.8125rem}
.back:hover{color:var(--text)}
.room-bar h2{font-size:1.125rem;margin-right:auto}
.room-grid{display:grid;grid-template-columns:1fr 296px;gap:var(--space-5);align-items:start}
.canvas{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);
  aspect-ratio:9/10;max-height:430px;display:grid;place-items:center;color:var(--text-3);font-size:.8125rem}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);
  padding:var(--space-4)}
.panel + .panel{margin-top:var(--space-4)}
.panel h3{font-size:.6875rem;font-weight:500;color:var(--text-3);
  letter-spacing:.12em;text-transform:uppercase;margin-bottom:var(--space-3)}
.seat{display:flex;align-items:center;gap:var(--space-3);padding:var(--space-2) 0;
  font-size:.875rem}
.sw{width:12px;height:12px;border-radius:3px;flex:none}
.sw-r{background:#E24B4A} .sw-k{background:#9AA1AC}
.msg{font-size:.8125rem;padding:var(--space-2) 0;color:var(--text-2);line-height:1.55}
.msg b{font-weight:500;color:var(--text);margin-right:6px}
.msg.sys{color:var(--text-3)}
.msg-input{display:flex;gap:var(--space-2);margin-top:var(--space-3)}
.msg-input input{flex:1;background:var(--bg-2);border:1px solid var(--border);
  border-radius:var(--radius-sm);padding:6px 10px;font-size:.8125rem}
.acts{display:flex;gap:var(--space-2);flex-wrap:wrap}

@media (max-width:980px){ .room-grid{grid-template-columns:1fr} }
@media (max-width:760px){
  .app{grid-template-columns:1fr}
  .side{border-right:0;border-bottom:1px solid var(--border);flex-direction:row;
    align-items:center;gap:var(--space-4);padding:var(--space-3) var(--space-4);overflow-x:auto}
  .nav{flex-direction:row;gap:var(--space-1)}
  .conn{margin:0;border:0;padding:0;white-space:nowrap}
  .main{padding:var(--space-6) var(--space-4)}
  .page-head{flex-direction:column;align-items:flex-start}
  .row{grid-template-columns:1fr auto;gap:var(--space-2) var(--space-3)}
  .row-head{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition-duration:.01ms !important}}
</style>
</head>
<body>
<h2 class="sr-only">风格方案 C：沉静暗色。深色底、侧边导航栏、低饱和金铜强调色构成的沉浸式游戏控制台界面。</h2>

<div class="app">
  <nav class="side">
    <div class="brand"><span class="brand-mark">局</span>局域网游戏厅</div>
    <div class="nav">
      <button class="nav-item" aria-current="page">游戏大厅<span class="count">5</span></button>
      <button class="nav-item">房间列表<span class="count">3</span></button>
      <button class="nav-item">对局记录</button>
      <button class="nav-item">设置</button>
    </div>
    <div class="conn">
      <div><span class="dot"></span>已连接</div>
      <div class="tnum">192.168.100.95:3100</div>
      <div>昵称 · 阿泽</div>
    </div>
  </nav>

  <main class="main">
    <div class="page-head">
      <div>
        <h1>选择游戏，开局</h1>
        <p>同一局域网，打开网页就能玩。零安装、零账号，房主一条命令启动。</p>
      </div>
      <div class="bar">
        <input class="search" type="search" placeholder="搜索游戏…" aria-label="搜索游戏" />
        <button class="btn btn-solid">创建房间</button>
      </div>
    </div>

    <div class="block-title"><h2>游戏目录</h2><span>5 款可用</span></div>
    <div class="grid">
      <button class="card">
        <div class="card-top"><span class="tile">象</span><span class="card-name">中国象棋</span></div>
        <span class="card-desc">完整规则，含绝杀与困毙判定</span>
        <div class="card-meta"><span class="chip">回合制</span><span class="chip">2 人</span><span class="chip">点击</span></div>
      </button>
      <button class="card">
        <div class="card-top"><span class="tile">坦</span><span class="card-name">坦克大战</span></div>
        <span class="card-desc">20 FPS 权威同步，子弹可反弹</span>
        <div class="card-meta"><span class="chip">实时</span><span class="chip">2–4 人</span><span class="chip">键盘</span></div>
      </button>
      <button class="card">
        <div class="card-top"><span class="tile">飞</span><span class="card-name">飞行棋</span></div>
        <span class="card-desc">掷骰起飞、同色跳跃、叠子保护</span>
        <div class="card-meta"><span class="chip">回合制</span><span class="chip">2–4 人</span><span class="chip">点击</span></div>
      </button>
      <button class="card">
        <div class="card-top"><span class="tile">五</span><span class="card-name">五子棋</span></div>
        <span class="card-desc">15×15 棋盘，五连即胜</span>
        <div class="card-meta"><span class="chip">回合制</span><span class="chip">2 人</span><span class="chip">点击</span></div>
      </button>
      <button class="card">
        <div class="card-top"><span class="tile">富</span><span class="card-name">大富翁</span></div>
        <span class="card-desc">买地盖房、过路收费、机会与命运</span>
        <div class="card-meta"><span class="chip">回合制</span><span class="chip">2–4 人</span><span class="chip">点击</span></div>
      </button>
    </div>

    <div class="block-title"><h2>房间列表</h2><span>每 3 秒自动刷新</span></div>
    <div class="rows">
      <div class="row row-head"><span>房间号</span><span>游戏</span><span>人数</span><span>状态</span><span></span></div>
      <div class="row">
        <span class="tnum">#4821</span><span>中国象棋</span><span class="tnum">1 / 2</span>
        <span><span class="tag tag-wait">等待中</span></span>
        <span><button class="btn btn-sm btn-solid">加入</button></span>
      </div>
      <div class="row">
        <span class="tnum">#4817</span><span>飞行棋</span><span class="tnum">3 / 4</span>
        <span><span class="tag tag-live">对局中</span></span>
        <span><button class="btn btn-sm">加入</button></span>
      </div>
      <div class="row">
        <span class="tnum">#4812</span><span>坦克大战</span><span class="tnum">2 / 4</span>
        <span><span class="tag tag-live">对局中</span></span>
        <span><button class="btn btn-sm">加入</button></span>
      </div>
    </div>

    <div class="room-bar">
      <button class="back">← 返回大厅</button>
      <h2>中国象棋</h2>
      <span class="tag tag-wait">等待中</span>
      <span class="tnum" style="color:var(--text-3);font-size:.8125rem">房间 #4821</span>
    </div>

    <div class="room-grid">
      <div class="canvas">棋盘画布区域</div>
      <aside>
        <div class="panel">
          <h3>玩家</h3>
          <div class="seat"><span class="sw sw-r"></span>红方 · 阿泽（你）</div>
          <div class="seat"><span class="sw sw-k"></span>黑方 · 小柯</div>
        </div>
        <div class="panel">
          <h3>聊天</h3>
          <div class="msg"><b>小柯</b>这把我要赢</div>
          <div class="msg sys"><b>系统</b>红方先行</div>
          <div class="msg-input">
            <input type="text" placeholder="输入消息…" aria-label="聊天输入" />
            <button class="btn btn-sm">发送</button>
          </div>
        </div>
        <div class="panel acts">
          <button class="btn">重新开始</button>
          <button class="btn">认输</button>
          <button class="btn">音效：开</button>
        </div>
      </aside>
    </div>
  </main>
</div>
</body>
</html>
