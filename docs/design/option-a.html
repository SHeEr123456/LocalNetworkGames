<!DOCTYPE html>
<html lang="zh-CN" data-theme="a">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>风格方案 A · 冷静工具感 — 局域网游戏厅</title>
<style>
:root{
  --gray-0:#FFFFFF; --gray-50:#F7F8FA; --gray-100:#EEF0F4; --gray-200:#E4E6EB;
  --gray-400:#9CA3AF; --gray-500:#6B7280; --gray-700:#3F4652; --gray-900:#111827;
  --accent:#4F46E5; --accent-hover:#4338CA; --accent-subtle:rgba(79,70,229,.08);
  --success:#16A34A; --success-subtle:rgba(22,163,74,.10);
  --warn:#D97706; --warn-subtle:rgba(217,119,6,.10);

  --bg:var(--gray-50); --surface:var(--gray-0); --surface-2:var(--gray-50);
  --border:var(--gray-200); --border-strong:#D3D7DE;
  --text:var(--gray-900); --text-muted:var(--gray-500); --text-faint:var(--gray-400);

  --space-1:4px; --space-2:8px; --space-3:12px; --space-4:16px;
  --space-5:20px; --space-6:24px; --space-8:32px; --space-10:40px; --space-12:48px;
  --radius-sm:6px; --radius-md:8px; --radius-lg:12px; --radius-full:9999px;
  --shadow-sm:0 1px 2px rgba(16,24,40,.05);

  --font-body:"Inter",system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  --text-h1:clamp(1.75rem,1.4rem+1.1vw,2.25rem);
  --text-h2:1.25rem; --text-h3:1rem; --text-body:.9375rem; --text-sm:.8125rem; --text-xs:.75rem;
  --dur:150ms; --ease:cubic-bezier(.22,1,.36,1);
}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font-body);
  font-size:var(--text-body);line-height:1.6;-webkit-font-smoothing:antialiased}
h1,h2,h3{margin:0;font-weight:600;letter-spacing:-.01em;line-height:1.3}
p{margin:0}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:var(--radius-sm)}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);border:0}

.nav{background:var(--surface);border-bottom:1px solid var(--border);height:56px;
  display:flex;align-items:center;justify-content:space-between;padding:0 var(--space-6);
  position:sticky;top:0;z-index:10}
.brand{display:flex;align-items:center;gap:var(--space-3);font-weight:600}
.brand-mark{width:24px;height:24px;border-radius:var(--radius-sm);background:var(--accent);
  display:grid;place-items:center;color:#fff;font-size:var(--text-xs);font-weight:700}
.nav-right{display:flex;align-items:center;gap:var(--space-4);font-size:var(--text-sm)}
.dot{width:6px;height:6px;border-radius:var(--radius-full);background:var(--success);display:inline-block;margin-right:6px}
.muted{color:var(--text-muted)}
.mono{font-variant-numeric:tabular-nums}

.wrap{max-width:1120px;margin:0 auto;padding:var(--space-10) var(--space-6) var(--space-12)}
.head{margin-bottom:var(--space-8)}
.head h1{font-size:var(--text-h1)}
.head p{margin-top:var(--space-2);color:var(--text-muted);max-width:52ch}

.section-title{font-size:var(--text-h3);font-weight:600;margin:var(--space-10) 0 var(--space-4);
  display:flex;align-items:baseline;justify-content:space-between}
.section-title span{font-size:var(--text-sm);font-weight:400;color:var(--text-muted)}

.grid{display:grid;gap:var(--space-4);grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);
  padding:var(--space-5);text-align:left;cursor:pointer;transition:border-color var(--dur) var(--ease),box-shadow var(--dur) var(--ease);
  display:flex;flex-direction:column;gap:var(--space-4);width:100%}
.card:hover{border-color:var(--border-strong);box-shadow:var(--shadow-sm)}
.card-top{display:flex;align-items:center;gap:var(--space-3)}
.tile{width:40px;height:40px;border-radius:var(--radius-md);background:var(--accent-subtle);
  color:var(--accent);display:grid;place-items:center;font-weight:600;font-size:1.0625rem;flex:none}
.card-name{font-weight:600}
.tags{display:flex;gap:var(--space-2);flex-wrap:wrap}
.tag{font-size:var(--text-xs);color:var(--text-muted);border:1px solid var(--border);
  border-radius:var(--radius-full);padding:2px 8px}
.card-foot{display:flex;align-items:center;justify-content:space-between;
  font-size:var(--text-sm);color:var(--text-muted);border-top:1px solid var(--border);padding-top:var(--space-3)}
.btn{border:1px solid var(--border);background:var(--surface);border-radius:var(--radius-md);
  padding:var(--space-2) var(--space-4);font-size:var(--text-sm);font-weight:500;cursor:pointer;
  transition:background var(--dur) var(--ease),border-color var(--dur) var(--ease)}
.btn:hover{border-color:var(--border-strong);background:var(--surface-2)}
.btn-primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn-primary:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
.btn-sm{padding:4px 10px;font-size:var(--text-xs)}

.rooms{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);overflow:hidden}
.row{display:grid;grid-template-columns:88px 1fr 96px 96px auto;gap:var(--space-4);align-items:center;
  padding:var(--space-4) var(--space-5);border-bottom:1px solid var(--border);font-size:var(--text-sm)}
.row:last-child{border-bottom:0}
.row-head{background:var(--surface-2);color:var(--text-muted);font-size:var(--text-xs);
  font-weight:500;padding-top:var(--space-3);padding-bottom:var(--space-3)}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:var(--text-xs);
  padding:2px 8px;border-radius:var(--radius-full);border:1px solid var(--border)}
.pill-wait{background:var(--warn-subtle);border-color:transparent;color:var(--warn)}
.pill-live{background:var(--success-subtle);border-color:transparent;color:var(--success)}

.room-head{display:flex;align-items:center;gap:var(--space-4);margin:var(--space-10) 0 var(--space-5)}
.room-head .back{border:0;background:transparent;color:var(--text-muted);cursor:pointer;
  font-size:var(--text-sm);padding:0}
.room-head .back:hover{color:var(--text)}
.room-title{font-size:var(--text-h3);font-weight:600}
.room-layout{display:grid;grid-template-columns:1fr 300px;gap:var(--space-5);align-items:start}
.board{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);
  aspect-ratio:9/10;max-height:460px;display:grid;place-items:center;color:var(--text-faint);font-size:var(--text-sm)}
.side{display:flex;flex-direction:column;gap:var(--space-4)}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);padding:var(--space-5)}
.panel h3{font-size:var(--text-sm);color:var(--text-muted);font-weight:500;margin-bottom:var(--space-4)}
.seat{display:flex;align-items:center;gap:var(--space-3);padding:var(--space-3) 0;
  border-bottom:1px solid var(--border);font-size:var(--text-sm)}
.seat:last-child{border-bottom:0}
.swatch{width:14px;height:14px;border-radius:var(--radius-full);flex:none}
.sw-red{background:#DC2626} .sw-black{background:#1F2937}
.chat-line{font-size:var(--text-sm);padding:var(--space-2) 0;border-bottom:1px solid var(--border)}
.chat-line:last-child{border-bottom:0}
.chat-line b{font-weight:500;margin-right:6px}
.chat-input{display:flex;gap:var(--space-2);margin-top:var(--space-4)}
.chat-input input{flex:1;border:1px solid var(--border);border-radius:var(--radius-md);
  padding:var(--space-2) var(--space-3);font-size:var(--text-sm);background:var(--surface)}
.actions{display:flex;gap:var(--space-3);flex-wrap:wrap}

@media (max-width:900px){ .room-layout{grid-template-columns:1fr} }
@media (max-width:640px){
  .wrap{padding:var(--space-6) var(--space-4) var(--space-10)}
  .nav{padding:0 var(--space-4)}
  .row{grid-template-columns:1fr 1fr;gap:var(--space-2) var(--space-4)}
  .row-head{display:none}
  .room-layout{gap:var(--space-4)}
}
@media (prefers-reduced-motion:reduce){*{transition-duration:.01ms !important}}
</style>
</head>
<body>
<h2 class="sr-only">风格方案 A：冷静工具感。以纯白卡片、1px 边框与单一靛蓝强调色构建的极简游戏大厅界面。</h2>

<header class="nav">
  <div class="brand"><span class="brand-mark">局</span>局域网游戏厅</div>
  <div class="nav-right">
    <span class="muted"><span class="dot"></span>已连接 <span class="mono">192.168.100.95:3100</span></span>
    <button class="btn btn-sm">昵称：阿泽</button>
  </div>
</header>

<main class="wrap">
  <div class="head">
    <h1>选择游戏，开局</h1>
    <p>同一局域网，打开网页就能玩。零安装、零账号，房主一条命令启动。</p>
  </div>

  <div class="section-title">游戏目录 <span>5 款可用</span></div>
  <div class="grid">
    <button class="card">
      <div class="card-top"><span class="tile">象</span><span class="card-name">中国象棋</span></div>
      <div class="tags"><span class="tag">回合制</span><span class="tag">2 人</span><span class="tag">点击</span></div>
      <div class="card-foot"><span>完整规则 · 含绝杀判定</span><span>开局</span></div>
    </button>
    <button class="card">
      <div class="card-top"><span class="tile">坦</span><span class="card-name">坦克大战</span></div>
      <div class="tags"><span class="tag">实时</span><span class="tag">2–4 人</span><span class="tag">键盘</span></div>
      <div class="card-foot"><span>20 FPS · 子弹反弹</span><span>开局</span></div>
    </button>
    <button class="card">
      <div class="card-top"><span class="tile">飞</span><span class="card-name">飞行棋</span></div>
      <div class="tags"><span class="tag">回合制</span><span class="tag">2–4 人</span><span class="tag">点击</span></div>
      <div class="card-foot"><span>掷骰起飞 · 叠子保护</span><span>开局</span></div>
    </button>
    <button class="card">
      <div class="card-top"><span class="tile">五</span><span class="card-name">五子棋</span></div>
      <div class="tags"><span class="tag">回合制</span><span class="tag">2 人</span><span class="tag">点击</span></div>
      <div class="card-foot"><span>15×15 · 五连判胜</span><span>开局</span></div>
    </button>
    <button class="card">
      <div class="card-top"><span class="tile">富</span><span class="card-name">大富翁</span></div>
      <div class="tags"><span class="tag">回合制</span><span class="tag">2–4 人</span><span class="tag">点击</span></div>
      <div class="card-foot"><span>买地盖房 · 机会命运</span><span>开局</span></div>
    </button>
  </div>

  <div class="section-title">房间列表 <span>3 个房间</span></div>
  <div class="rooms">
    <div class="row row-head"><span>房间号</span><span>游戏</span><span>人数</span><span>状态</span><span></span></div>
    <div class="row">
      <span class="mono">#4821</span><span>中国象棋</span><span class="mono">1 / 2</span>
      <span><span class="pill pill-wait">等待中</span></span>
      <span><button class="btn btn-sm btn-primary">加入</button></span>
    </div>
    <div class="row">
      <span class="mono">#4817</span><span>飞行棋</span><span class="mono">3 / 4</span>
      <span><span class="pill pill-live">对局中</span></span>
      <span><button class="btn btn-sm">加入</button></span>
    </div>
    <div class="row">
      <span class="mono">#4812</span><span>坦克大战</span><span class="mono">2 / 4</span>
      <span><span class="pill pill-live">对局中</span></span>
      <span><button class="btn btn-sm">加入</button></span>
    </div>
  </div>

  <div class="room-head">
    <button class="back">← 返回大厅</button>
    <span class="room-title">中国象棋</span>
    <span class="pill pill-wait">等待中</span>
    <span class="muted mono">房间 #4821</span>
  </div>

  <div class="room-layout">
    <div class="board">棋盘画布区域</div>
    <aside class="side">
      <div class="panel">
        <h3>玩家</h3>
        <div class="seat"><span class="swatch sw-red"></span>红方 · 阿泽（你）</div>
        <div class="seat"><span class="swatch sw-black"></span>黑方 · 小柯</div>
      </div>
      <div class="panel">
        <h3>聊天</h3>
        <div class="chat-line"><b>小柯</b>这把我要赢</div>
        <div class="chat-line"><b>系统</b>红方先行</div>
        <div class="chat-input">
          <input type="text" placeholder="输入消息…" aria-label="聊天输入" />
          <button class="btn btn-sm btn-primary">发送</button>
        </div>
      </div>
      <div class="panel actions">
        <button class="btn">重新开始</button>
        <button class="btn">认输</button>
        <button class="btn">音效：开</button>
      </div>
    </aside>
  </div>
</main>
</body>
</html>
